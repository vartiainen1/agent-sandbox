# agent-sandbox CI — native Ubuntu is the AUTHORITATIVE Linux validation
# substrate. Docker Desktop results are never labeled as native (see
# docs/seccomp-derivation/verification.md).
#
# If the GitHub-hosted runner cannot provide a required security mechanism
# (e.g. unprivileged user namespaces are AppArmor-restricted), the rootless
# capability probe DETECTS and RECORDS it with a reason - it is never
# converted into a false PASS. That limitation is documented, not papered
# over, and HARDENED mode is never weakened to make CI green.

name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  native-linux:
    name: native ubuntu ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux tooling (strace for native syscall observation)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace

      - name: Compile check (all Python)
        run: python -m compileall -q tools agent_sandbox

      - name: Phase 18 - ruff lint (security + code quality rules)
        run: pip install ruff && ruff check .

      - name: Phase 18 - mypy type check (agent_sandbox)
        run: pip install mypy && mypy agent_sandbox --ignore-missing-imports

      - name: Phase 18 - bandit security scan (high-severity only, justified exclusions)
        run: pip install bandit && bandit -r agent_sandbox --skip B101,B108,B606,B110,B603,B607 -ll

      - name: Phase 18 - pip-audit dependency audit (zero runtime deps)
        run: pip install pip-audit && pip-audit -r /dev/null --desc

      - name: Phase 18 - detect-secrets scan (baseline checked)
        run: pip install detect-secrets && detect-secrets audit --report .secrets.baseline

      - name: Phase E deterministic fuzz harness (host-side fail-safe evidence - seed 0xC0FFEE, bounded)
        run: python -m unittest discover -s tests/fuzz -t . -v

      - name: Runtime unit tests (skeleton, fail-closed init, execution gate, namespace wiring)
        run: python -m unittest discover -s tests -t . -v

      - name: Namespace isolation tests (real Linux, non-root - authoritative)
        run: python -m unittest tests.unit.test_namespaces -v

      - name: Filesystem boundary tests (rootfs, pivot_root, workspace isolation - authoritative)
        run: python -m unittest tests.unit.test_rootfs -v

      - name: Proc/dev/sys boundary tests (/proc hidepid=2, minimal /dev, /sys absence - authoritative)
        run: python -m unittest tests.unit.test_procdev -v

      - name: Network deny-by-construction tests (netns state, no usable path - authoritative)
        run: python -m unittest tests.unit.test_network -v

      - name: no_new_privs tests (kernel-state read-back, ordering, fail-closed - authoritative)
        run: python -m unittest tests.unit.test_privileges -v

      - name: rlimits tests (six limits, read-back, seccomp interaction, inheritance - authoritative)
        run: python -m unittest tests.unit.test_resources -v

      - name: cgroup v2 tests (delegation probe, four controllers, io device, fail-closed - authoritative)
        run: python -m unittest tests.unit.test_cgroups -v

      - name: environment sanitization tests (six-variable construction, host-env leakage, fail-closed - authoritative)
        run: python -m unittest tests.unit.test_environment -v

      - name: credential/socket isolation tests (host path absence, socket env, denial, fail-closed - authoritative)
        run: python -m unittest tests.unit.test_credentials -v

      - name: bounded output tests (S-037 bounded pipe, truncation notice, no bypass, fail-closed - authoritative)
        run: python -m unittest tests.unit.test_output -v

      - name: external timeout tests (S-036 supervisor deadline, session termination, no false success - authoritative)
        run: python -m unittest tests.unit.test_timeout -v

      - name: process-tree containment + cleanup tests (S-014 child subreaper, whole-tree kill, S-038 absence verification - authoritative)
        run: python -m unittest tests.unit.test_lifecycle -v

      - name: minimal successful workload tests (end-to-end item 22 - deterministic output, in-sandbox invariants, READY gate, fail-closed - authoritative)
        run: python -m unittest tests.unit.test_workload -v

      - name: CLI interface tests (execution bridge, argv-only, audit JSONL, fail-closed, no-shell guard - authoritative)
        run: python -m unittest tests.unit.test_cli -v

      - name: MCP interface tests (stdio JSON-RPC 2.0, decision equivalence, no-leak, fail-closed, no-shell guard - authoritative)
        run: python -m unittest tests.unit.test_mcp -v

      - name: API interface tests (stdlib HTTP, three-way decision equivalence, no-leak, fail-closed, no-shell guard - authoritative)
        run: python -m unittest tests.unit.test_api -v

      - name: Unit + regression tests (artifact integrity, gate, BPF layout, fail-closed guard)
        run: python3 tools/seccomp-derivation/test_derivation.py

      - name: Native syscall observation (trace)
        run: python3 tools/seccomp-derivation/trace_workloads.py --out /tmp/trace-native.json

      - name: Seccomp regression gate - no undocumented syscall expansion
        run: python3 tools/seccomp-derivation/check_trace_regression.py /tmp/trace-native.json

      - name: Behavioral seccomp probe (runs as non-root runner user)
        run: python3 tools/seccomp-derivation/probe_policy.py

      - name: Rootless capability detection (records VERIFIED/BLOCKED with reason)
        run: python3 tools/seccomp-derivation/check_rootless_capabilities.py

      - name: Phase 20 - release reproducibility + integrity (deterministic sdist/wheel, SHA-256 manifest, tamper detection)
        run: python3 tools/release/test_release.py
